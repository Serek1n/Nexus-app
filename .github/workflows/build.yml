name: Сборка Nexus

on:
  # Каждая сборка публикуется в релиз.
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  # Каждый день проверяем, не вышел ли новый Xray. Если вышел —
  # собираем Nexus со свежим ядром и публикуем релиз (приложения обновятся сами).
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  ORG: app.nexusvpn
  GEO_URL: https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download
  # Куда публиковать релизы и откуда приложение берёт обновления.
  # Для закрытого репозитория задайте переменную RELEASES_REPO (открытый репозиторий)
  # и секрет RELEASES_TOKEN — см. README.
  UPDATE_REPO: ${{ vars.RELEASES_REPO || github.repository }}

jobs:
  check:
    name: Проверка версии Xray
    runs-on: ubuntu-latest
    outputs:
      xray: ${{ steps.c.outputs.xray }}
      build: ${{ steps.c.outputs.build }}
      release: ${{ steps.c.outputs.release }}
      prerelease: ${{ steps.c.outputs.prerelease }}
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          XRAY=$(git ls-remote --tags --refs https://github.com/2dust/AndroidLibXrayLite.git \
                 | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Последний Xray для Android: $XRAY"
          echo "xray=$XRAY" >> $GITHUB_OUTPUT
          echo "build=$(( ${{ github.run_number }} + 100 ))" >> $GITHUB_OUTPUT

          RELEASE=true; PRE=false; RUN=true
          case "${{ github.event_name }}" in
            schedule)
              # По расписанию собираем, только если вышел новый Xray.
              if gh release list -R "$UPDATE_REPO" --limit 30 --json name -q '.[].name' 2>/dev/null \
                   | grep -q "Xray ${XRAY#v}\$"; then
                echo "Релиз с Xray ${XRAY#v} уже есть — пропускаем"; RUN=false; RELEASE=false
              fi ;;
            pull_request)
              # Сборка из pull request — пробный релиз: приложения его не ставят.
              PRE=true
              if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
                RELEASE=false   # из чужих форков не публикуем
              fi ;;
          esac
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "prerelease=$PRE" >> $GITHUB_OUTPUT
          echo "run=$RUN" >> $GITHUB_OUTPUT

  android:
    name: Android (APK)
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      XRAY: ${{ needs.check.outputs.xray }}
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      # Плагин ядра Xray пока несовместим с AGP 9 (Flutter 3.44+), поэтому версия зафиксирована.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Сгенерировать платформу Android
        run: |
          flutter create --platforms=android,windows --org $ORG --project-name nexus .
          rm -rf test
          python3 tool/patch_platforms.py

      - name: Гео-базы для умной маршрутизации (с проверкой SHA-256)
        run: |
          mkdir -p android/app/src/main/assets
          cd android/app/src/main/assets
          for f in geoip.dat geosite.dat; do
            curl -fsSL -o $f $GEO_URL/$f
            curl -fsSL -o $f.sha256sum $GEO_URL/$f.sha256sum
            sha256sum -c $f.sha256sum
            rm $f.sha256sum
          done

      - name: Ключ подписи (если задан в секретах)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/nexus-release.jks
            cat > android/key.properties <<EOF
          storeFile=nexus-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Подпись: релизный ключ"
          else
            # Без постоянного ключа каждая сборка подписывается новым
            # отладочным ключом, и Android отказывается ставить обновление
            # («конфликтует с другим пакетом»). Такие сборки не выпускаем.
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::KEYSTORE_BASE64 не задан — пробная сборка с отладочным ключом"
            else
              echo "::error::Не задан секрет KEYSTORE_BASE64 (и KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Добавьте их из github-secrets.txt: Settings → Secrets and variables → Actions."
              echo "Не заданы секреты подписи APK (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Добавьте их из github-secrets.txt в Settings → Secrets and variables → Actions и перезапустите сборку." > ci.log
              exit 1
            fi
          fi

      - name: Зависимости и иконки
        run: |
          flutter pub get 2>&1 | tee -a ci.log
          dart run flutter_launcher_icons 2>&1 | tee -a ci.log
          # Защита приёмников статуса VPN в плагине (Android 8–12).
          python3 tool/patch_plugin.py 2>&1 | tee -a ci.log
          test ${PIPESTATUS[0]} -eq 0

      # ── Свежее ядро Xray: собираем libv2ray.aar из 2dust/AndroidLibXrayLite ──
      - name: Исходники ядра Xray ${{ env.XRAY }}
        id: alx
        continue-on-error: true
        run: |
          git clone -q --depth 1 --branch "$XRAY" https://github.com/2dust/AndroidLibXrayLite.git alx
          cp tool/xray-android/protector.go alx/

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.alx.outcome == 'success'
        continue-on-error: true
        with:
          go-version-file: alx/go.mod
          cache: false

      - name: Сборка ядра Xray для Android
        id: aar
        if: steps.alx.outcome == 'success'
        continue-on-error: true
        run: |
          set -eo pipefail
          cd alx
          # gomobile той же версии, что указана в go.mod ядра (не @latest).
          MOBILE=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$MOBILE golang.org/x/mobile/cmd/gobind@$MOBILE
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p assets
          gomobile init
          go mod tidy
          gomobile bind -androidapi 21 -target android/arm64,android/arm,android/amd64 \
            -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./ 2>&1 | tail -30

          # Проверяем, что API совпадает с тем, что ждёт плагин.
          mkdir -p chk && unzip -o -q libv2ray.aar classes.jar -d chk
          for m in useProtector setProtectorServer newCoreController initCoreEnv measureOutboundDelay checkVersionX; do
            javap -cp chk/classes.jar libv2ray.Libv2ray | grep -q " $m(" || { echo "Нет метода $m"; exit 1; }
          done
          for m in startLoop stopLoop queryAllOutboundTrafficStats measureDelay; do
            javap -cp chk/classes.jar libv2ray.CoreController | grep -q " $m(" || { echo "Нет метода $m"; exit 1; }
          done

          # Подменяем ядро в плагине flutter_v2ray_client.
          PLUGIN=$(python3 -c "
          import json, pathlib, urllib.parse
          cfg = json.load(open('../.dart_tool/package_config.json'))
          p = next(x for x in cfg['packages'] if x['name'] == 'flutter_v2ray_client')
          u = p['rootUri']
          print(urllib.parse.urlparse(u).path if u.startswith('file:') else (pathlib.Path('../.dart_tool') / u).resolve())
          ")
          cp libv2ray.aar "$PLUGIN/android/libs/libv2ray.aar"
          echo "Ядро заменено: $PLUGIN/android/libs/libv2ray.aar"

      - name: Итог по ядру
        run: |
          if [ "${{ steps.aar.outcome }}" = "success" ]; then
            echo "CORE=${XRAY#v}" >> $GITHUB_ENV
            echo "### ✅ Android: собран свежий Xray ${XRAY#v}" >> $GITHUB_STEP_SUMMARY
          else
            echo "CORE=встроенное" >> $GITHUB_ENV
            echo "::warning::Не удалось собрать свежий Xray — используется ядро, встроенное в плагин"
            echo "### ⚠️ Android: свежий Xray не собран, использовано встроенное ядро" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Ключ проверки обновлений
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            echo "$UPDATE_SIGNING_KEY" | base64 -d > upd.pem
            PUB=$(openssl pkey -in upd.pem -pubout -outform DER | tail -c 32 | base64 -w0)
            rm upd.pem
            echo "UPDATE_PUBKEY=$PUB" >> $GITHUB_ENV
            echo "Обновления будут проверяться подписью"
          else
            echo "::warning::Секрет UPDATE_SIGNING_KEY не задан — подпись обновлений отключена"
          fi

      # NDK ставим заранее и с повторами: если Gradle качает его сам во время
      # сборки и архив приходит битым, сборка падает с «did not have a
      # source.properties file».
      - name: Android NDK
        run: |
          FT="$(dirname "$(dirname "$(which flutter)")")/packages/flutter_tools"
          NDK=$(grep -hoE 'val ndkVersion: String = "[0-9.]+"' "$FT/gradle/src/main/kotlin/FlutterExtension.kt" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          NDK=${NDK:-28.2.13676358}
          echo "Нужен NDK $NDK"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            if [ -f "$SDK/ndk/$NDK/source.properties" ]; then break; fi
            sudo rm -rf "$SDK/ndk/$NDK"
            yes | sudo "$SM" --install "ndk;$NDK" > /dev/null 2>&1 || true
            sleep 5
          done
          if [ ! -f "$SDK/ndk/$NDK/source.properties" ]; then
            echo "Не удалось скачать Android NDK $NDK (сбой серверов Google) — перезапустите сборку." | tee -a ci.log
            exit 1
          fi
          echo "NDK $NDK на месте"

      - name: Сборка APK
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VER=$VER" >> $GITHUB_ENV
          COMMON="--release --obfuscate --split-debug-info=build/symbols --build-name=$VER --build-number=$BUILD --dart-define=UPDATE_REPO=$UPDATE_REPO --dart-define=APP_VERSION=$VER --dart-define=APP_BUILD=$BUILD --dart-define=UPDATE_PUBKEY=$UPDATE_PUBKEY"
          flutter build apk $COMMON --split-per-abi 2>&1 | tee -a ci.log
          flutter build apk $COMMON 2>&1 | tee -a ci.log
          mkdir -p dist
          OUT=build/app/outputs/flutter-apk
          cp $OUT/app-release.apk             dist/Nexus-universal.apk
          cp $OUT/app-arm64-v8a-release.apk   dist/Nexus-arm64.apk
          cp $OUT/app-armeabi-v7a-release.apk dist/Nexus-armv7.apk
          cd dist && sha256sum *.apk > SHA256SUMS-android.txt
          echo "$CORE" > xray-android.txt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Nexus-Android
          path: dist/*

      - name: Причина ошибки
        if: failure()
        run: |
          {
            echo "## ❌ Android: причина ошибки"
            echo '```'
            if [ -f ci.log ]; then
              grep -n -E "What went wrong|FAILURE|error:|Error:|Exception|Could not|> " ci.log | tail -40 || true
              echo "----- последние строки -----"
              tail -40 ci.log
            else
              echo "Лог сборки не создан — ошибка на шаге до сборки, откройте задачу Android (APK)."
            fi
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  windows:
    name: Windows (x64)
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: windows-latest
    env:
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Сгенерировать платформу Windows
        shell: bash
        run: |
          flutter create --platforms=android,windows --org $ORG --project-name nexus .
          rm -rf test
          python tool/patch_platforms.py

      - name: Зависимости и иконки
        shell: bash
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          # Своя многоразмерная иконка: чёткая на панели задач.
          cp assets/icon/app_icon.ico windows/runner/resources/app_icon.ico

      - name: Ключ проверки обновлений
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            echo "$UPDATE_SIGNING_KEY" | base64 -d > upd.pem
            PUB=$(openssl pkey -in upd.pem -pubout -outform DER | tail -c 32 | base64 -w0)
            rm upd.pem
            echo "UPDATE_PUBKEY=$PUB" >> $GITHUB_ENV
            echo "Обновления будут проверяться подписью"
          else
            echo "::warning::Секрет UPDATE_SIGNING_KEY не задан — подпись обновлений отключена"
          fi

      - name: Сборка
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          flutter build windows --release --obfuscate --split-debug-info=build/symbols \
            --build-name=$VER --build-number=$BUILD \
            --dart-define=UPDATE_REPO=$UPDATE_REPO --dart-define=APP_VERSION=$VER --dart-define=APP_BUILD=$BUILD --dart-define=UPDATE_PUBKEY=$UPDATE_PUBKEY

      - name: Ядро Xray и гео-базы
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          $base = "https://github.com/XTLS/Xray-core/releases/latest/download"
          Invoke-WebRequest "$base/Xray-windows-64.zip" -OutFile xray.zip
          Invoke-WebRequest "$base/Xray-windows-64.zip.dgst" -OutFile xray.dgst
          $want = ((Get-Content xray.dgst -Raw) | Select-String -Pattern 'SHA2-256=\s*([0-9a-fA-F]{64})').Matches[0].Groups[1].Value.ToLower()
          $got = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "Контрольная сумма Xray не совпала: $got != $want" }
          Expand-Archive xray.zip -DestinationPath xray
          Copy-Item xray\xray.exe "$rel\nexus-core.exe"
          # Драйвер виртуальной сетевой карты для режима TUN (идёт в архиве Xray).
          Copy-Item xray\wintun.dll "$rel\wintun.dll"
          Copy-Item xray\LICENSE-Wintun "$rel\LICENSE-Wintun.txt"
          foreach ($g in "geoip.dat","geosite.dat") {
            Invoke-WebRequest "$env:GEO_URL/$g" -OutFile "$rel\$g"
            Invoke-WebRequest "$env:GEO_URL/$g.sha256sum" -OutFile "$g.sha256sum"
            $want = ((Get-Content "$g.sha256sum" -Raw).Trim() -split '\s+')[0].ToLower()
            $got = (Get-FileHash "$rel\$g" -Algorithm SHA256).Hash.ToLower()
            if ($want -ne $got) { throw "Контрольная сумма $g не совпала" }
          }
          & "$rel\nexus-core.exe" version

      - name: Архив
        shell: pwsh
        run: |
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([\d.]+)').Matches[0].Groups[1].Value)
          echo "VER=$ver" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\Nexus-Windows-x64.zip"

      - name: Установщик
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VER" tool\nexus.iss

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Nexus-Windows
          path: dist/*

  release:
    name: Релиз
    needs: [check, android, windows]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            pubspec.yaml
            lib/changelog.dart
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: out
          merge-multiple: true

      - name: Описание релиза
        id: meta
        run: |
          # В релиз идёт только ядро, собранное из исходников в этой сборке.
          if [ "$(cat out/xray-android.txt 2>/dev/null)" != "${{ needs.check.outputs.xray }}" ] && \
             [ "$(cat out/xray-android.txt 2>/dev/null)" != "$(echo ${{ needs.check.outputs.xray }} | sed 's/^v//')" ]; then
            echo "::error::Свежее ядро Xray для Android не собралось — релиз не публикуется (файлы есть в артефактах сборки)"
            exit 1
          fi
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          BUILD=${{ needs.check.outputs.build }}
          CORE=$(cat out/xray-android.txt 2>/dev/null || echo "")
          XRAY=${{ needs.check.outputs.xray }}
          cd out
          rm -f xray-android.txt
          rm -f SHA256SUMS-android.txt
          sha256sum * > SHA256SUMS.txt
          cd ..
          NAME="Nexus $VER"
          if [ "$CORE" = "${XRAY#v}" ]; then NAME="$NAME · Xray ${XRAY#v}"; else CORE=""; fi
          if [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then
            NAME="$NAME · PR #${{ github.event.pull_request.number }}"
          fi
          echo "name=$NAME" >> $GITHUB_OUTPUT
          # Тег — просто версия. Для пробных сборок из PR — с номером PR.
          if [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then
            echo "tag=v$VER-pr${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$VER" >> $GITHUB_OUTPUT
          fi
          # «Что нового» — из lib/changelog.dart для этой версии.
          NOTES=$(python3 - "$VER" <<'PY'
          import re, sys
          src = open('lib/changelog.dart', encoding='utf-8').read()
          m = re.search(r"\('" + re.escape(sys.argv[1]) + r"',\s*\[(.*?)\]\)", src, re.S)
          for item in re.findall(r"'((?:[^'\\]|\\.)*)'", m.group(1) if m else ''):
              print('- ' + item.replace("\\'", "'"))
          PY
          )
          {
            if [ -n "$NOTES" ]; then
              echo "### Что нового"
              echo "$NOTES"
              echo
            fi
            echo "**Android:** Nexus-arm64.apk — большинство телефонов, Nexus-armv7.apk — старые, Nexus-universal.apk — любой."
            echo "**Windows:** Nexus-Setup-$VER.exe — установщик, Nexus-Windows-x64.zip — портативная версия."
            echo
            echo "<!--"
            echo "nexus-build: $BUILD"
            echo "xray: ${CORE}"
            echo "-->"
          } > notes.md

      # Повторная сборка той же версии заменяет прежний релиз, а не плодит новые.
      - name: Убрать прежний релиз этой версии
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" -R "$UPDATE_REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "$UPDATE_REPO" --cleanup-tag -y
            echo "Прежний релиз $TAG заменён"
          fi

      - name: Подпись релиза
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            echo "$UPDATE_SIGNING_KEY" | base64 -d > upd.pem
            openssl pkeyutl -sign -inkey upd.pem -rawin -in out/SHA256SUMS.txt -out out/SHA256SUMS.txt.sig
            rm upd.pem
            echo "Релиз подписан"
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: ${{ env.UPDATE_REPO }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ vars.RELEASES_REPO == '' && github.sha || '' }}
          name: ${{ steps.meta.outputs.name }}
          body_path: notes.md
          files: out/*
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.check.outputs.prerelease == 'true' && 'false' || 'true' }}
