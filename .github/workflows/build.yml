name: Сборка Nexus

on:
  # Каждая сборка публикуется в релиз.
  push:
    # beta — пробные сборки: приходят только тем, кто включил «Бета-версии».
    branches: [main, master, beta]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  # Каждый день проверяем, не вышел ли новый Xray. Если вышел —
  # собираем Nexus со свежим ядром и публикуем релиз (приложения обновятся сами).
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  ORG: app.nexusvpn
  GEO_URL: https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download
  # Список заблокированных в России сайтов для режима «Только заблокированное».
  RF_URL: https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download
  # Куда публиковать релизы и откуда приложение берёт обновления.
  # Для закрытого репозитория задайте переменную RELEASES_REPO (открытый репозиторий)
  # и секрет RELEASES_TOKEN — см. README.
  UPDATE_REPO: ${{ vars.RELEASES_REPO || github.repository }}
  # Куда ведёт кнопка «Продлить», если панель не прислала свою ссылку
  # (например, приглашение в Discord-бота). Переменная репозитория RENEW_URL.
  RENEW_URL: ${{ vars.RENEW_URL }}
  # Сборки из ветки beta подписываются в приложении как «beta».
  APP_CHANNEL: ${{ github.ref_name == 'beta' && 'beta' || 'stable' }}

jobs:
  check:
    name: Проверка версии Xray
    runs-on: ubuntu-latest
    outputs:
      xray: ${{ steps.c.outputs.xray }}
      build: ${{ steps.c.outputs.build }}
      release: ${{ steps.c.outputs.release }}
      prerelease: ${{ steps.c.outputs.prerelease }}
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          XRAY=$(git ls-remote --tags --refs https://github.com/2dust/AndroidLibXrayLite.git \
                 | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Последний Xray для Android: $XRAY"
          echo "xray=$XRAY" >> $GITHUB_OUTPUT
          echo "build=$(( ${{ github.run_number }} + 100 ))" >> $GITHUB_OUTPUT

          RELEASE=true; PRE=false; RUN=true
          if [ "${{ github.ref_name }}" = "beta" ]; then PRE=true; fi
          case "${{ github.event_name }}" in
            schedule)
              # По расписанию собираем, только если вышел новый Xray.
              if gh release list -R "$UPDATE_REPO" --limit 30 --json name -q '.[].name' 2>/dev/null \
                   | grep -q "Xray ${XRAY#v}\$"; then
                echo "Релиз с Xray ${XRAY#v} уже есть — пропускаем"; RUN=false; RELEASE=false
              fi ;;
            pull_request)
              # Сборка из pull request — пробный релиз: приложения его не ставят.
              PRE=true
              if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
                RELEASE=false   # из чужих форков не публикуем
              fi ;;
          esac
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "prerelease=$PRE" >> $GITHUB_OUTPUT
          echo "run=$RUN" >> $GITHUB_OUTPUT

  # Быстрая проверка кода: ошибки видны за пару минут, с номером строки,
  # до долгой сборки APK и Windows.
  code:
    name: Проверка кода
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Зависимости
        run: flutter pub get
      - name: Анализ кода
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
      - name: Тесты
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log
      - name: Причина ошибки
        if: failure()
        run: |
          {
            echo "## ❌ Проверка кода не прошла"
            echo '```'
            grep -E "error •|error -|Expected|Actual|FAILED|Some tests failed" analyze.log test.log 2>/dev/null | head -40
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  android:
    name: Android (APK)
    needs: [check, code]
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      XRAY: ${{ needs.check.outputs.xray }}
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      # Плагин ядра Xray пока несовместим с AGP 9 (Flutter 3.44+), поэтому версия зафиксирована.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Сгенерировать платформу Android
        run: |
          flutter create --platforms=android,windows --org $ORG --project-name nexus .
          rm -f test/widget_test.dart
          python3 tool/patch_platforms.py

      - name: Гео-базы для умной маршрутизации (с проверкой SHA-256)
        run: |
          mkdir -p android/app/src/main/assets
          cd android/app/src/main/assets
          for f in geoip.dat geosite.dat; do
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o $f $GEO_URL/$f
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o $f.sha256sum $GEO_URL/$f.sha256sum
            sha256sum -c $f.sha256sum
            rm $f.sha256sum
          done
          # Из большой базы runetfreedom (~90 МБ) берём только ru-blocked (~1,5 МБ).
          # Не скачалось — собираем без него, режим работает по встроенному списку.
          cd "$GITHUB_WORKSPACE"
          mkdir -p /tmp/rf && cd /tmp/rf
          if curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o geosite.dat $RF_URL/geosite.dat \
             && curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o geosite.dat.sha256sum $RF_URL/geosite.dat.sha256sum \
             && sha256sum -c geosite.dat.sha256sum \
             && python3 "$GITHUB_WORKSPACE/tool/make_blocked_dat.py" geosite.dat "$GITHUB_WORKSPACE/android/app/src/main/assets/nexus-blocked.dat"; then
            echo "BLOCKED_DAT=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Список заблокированных сайтов не собран — режим «Только заблокированное» по встроенному списку"
            echo "BLOCKED_DAT=false" >> "$GITHUB_ENV"
          fi
          rm -rf /tmp/rf

      - name: Ключ подписи (если задан в секретах)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/nexus-release.jks
            cat > android/key.properties <<EOF
          storeFile=nexus-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Подпись: релизный ключ"
          else
            # Без постоянного ключа каждая сборка подписывается новым
            # отладочным ключом, и Android отказывается ставить обновление
            # («конфликтует с другим пакетом»). Такие сборки не выпускаем.
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::KEYSTORE_BASE64 не задан — пробная сборка с отладочным ключом"
            else
              echo "::error::Не задан секрет KEYSTORE_BASE64 (и KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Добавьте их из github-secrets.txt: Settings → Secrets and variables → Actions."
              echo "Не заданы секреты подписи APK (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Добавьте их из github-secrets.txt в Settings → Secrets and variables → Actions и перезапустите сборку." > ci.log
              exit 1
            fi
          fi

      - name: Зависимости и иконки
        run: |
          flutter pub get 2>&1 | tee -a ci.log
          dart run flutter_launcher_icons 2>&1 | tee -a ci.log
          # Защита приёмников статуса VPN в плагине (Android 8–12).
          python3 tool/patch_plugin.py 2>&1 | tee -a ci.log
          test ${PIPESTATUS[0]} -eq 0

      # ── Свежее ядро Xray: собираем libv2ray.aar из 2dust/AndroidLibXrayLite ──
      - name: Исходники ядра Xray ${{ env.XRAY }}
        id: alx
        continue-on-error: true
        run: |
          git clone -q --depth 1 --branch "$XRAY" https://github.com/2dust/AndroidLibXrayLite.git alx
          cp tool/xray-android/protector.go alx/

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.alx.outcome == 'success'
        continue-on-error: true
        with:
          go-version-file: alx/go.mod
          cache: false

      - name: Сборка ядра Xray для Android
        id: aar
        if: steps.alx.outcome == 'success'
        continue-on-error: true
        run: |
          set -eo pipefail
          cd alx
          # gomobile той же версии, что указана в go.mod ядра (не @latest).
          MOBILE=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$MOBILE golang.org/x/mobile/cmd/gobind@$MOBILE
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p assets
          gomobile init
          go mod tidy
          gomobile bind -androidapi 21 -target android/arm64,android/arm,android/amd64 \
            -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./ 2>&1 | tail -30

          # Проверяем, что API совпадает с тем, что ждёт плагин.
          mkdir -p chk && unzip -o -q libv2ray.aar classes.jar -d chk
          for m in useProtector setProtectorServer newCoreController initCoreEnv measureOutboundDelay checkVersionX; do
            javap -cp chk/classes.jar libv2ray.Libv2ray | grep -q " $m(" || { echo "Нет метода $m"; exit 1; }
          done
          for m in startLoop stopLoop queryAllOutboundTrafficStats measureDelay; do
            javap -cp chk/classes.jar libv2ray.CoreController | grep -q " $m(" || { echo "Нет метода $m"; exit 1; }
          done

          # Подменяем ядро в плагине flutter_v2ray_client.
          PLUGIN=$(python3 -c "
          import json, pathlib, urllib.parse
          cfg = json.load(open('../.dart_tool/package_config.json'))
          p = next(x for x in cfg['packages'] if x['name'] == 'flutter_v2ray_client')
          u = p['rootUri']
          print(urllib.parse.urlparse(u).path if u.startswith('file:') else (pathlib.Path('../.dart_tool') / u).resolve())
          ")
          cp libv2ray.aar "$PLUGIN/android/libs/libv2ray.aar"
          echo "Ядро заменено: $PLUGIN/android/libs/libv2ray.aar"

      - name: Итог по ядру
        run: |
          if [ "${{ steps.aar.outcome }}" = "success" ]; then
            echo "CORE=${XRAY#v}" >> $GITHUB_ENV
            echo "### ✅ Android: собран свежий Xray ${XRAY#v}" >> $GITHUB_STEP_SUMMARY
          else
            echo "CORE=встроенное" >> $GITHUB_ENV
            echo "::warning::Не удалось собрать свежий Xray — используется ядро, встроенное в плагин"
            echo "### ⚠️ Android: свежий Xray не собран, использовано встроенное ядро" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Ключ проверки обновлений
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            echo "$UPDATE_SIGNING_KEY" | base64 -d > upd.pem
            PUB=$(openssl pkey -in upd.pem -pubout -outform DER | tail -c 32 | base64 -w0)
            rm upd.pem
            echo "UPDATE_PUBKEY=$PUB" >> $GITHUB_ENV
            echo "Обновления будут проверяться подписью"
          else
            echo "::warning::Секрет UPDATE_SIGNING_KEY не задан — подпись обновлений отключена"
          fi

      # NDK ставим заранее и с повторами: если Gradle качает его сам во время
      # сборки и архив приходит битым, сборка падает с «did not have a
      # source.properties file».
      - name: Android NDK
        run: |
          FT="$(dirname "$(dirname "$(which flutter)")")/packages/flutter_tools"
          NDK=$(grep -hoE 'val ndkVersion: String = "[0-9.]+"' "$FT/gradle/src/main/kotlin/FlutterExtension.kt" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          NDK=${NDK:-28.2.13676358}
          echo "Нужен NDK $NDK"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            if [ -f "$SDK/ndk/$NDK/source.properties" ]; then break; fi
            sudo rm -rf "$SDK/ndk/$NDK"
            yes | sudo "$SM" --install "ndk;$NDK" > /dev/null 2>&1 || true
            sleep 5
          done
          if [ ! -f "$SDK/ndk/$NDK/source.properties" ]; then
            echo "Не удалось скачать Android NDK $NDK (сбой серверов Google) — перезапустите сборку." | tee -a ci.log
            exit 1
          fi
          echo "NDK $NDK на месте"

      - name: Сборка APK
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VER=$VER" >> $GITHUB_ENV
          COMMON="--release --obfuscate --split-debug-info=build/symbols --build-name=$VER --build-number=$BUILD --dart-define=UPDATE_REPO=$UPDATE_REPO --dart-define=APP_VERSION=$VER --dart-define=APP_BUILD=$BUILD --dart-define=UPDATE_PUBKEY=$UPDATE_PUBKEY --dart-define=RENEW_URL=$RENEW_URL --dart-define=APP_CHANNEL=$APP_CHANNEL --dart-define=BLOCKED_DAT=$BLOCKED_DAT"
          flutter build apk $COMMON --split-per-abi 2>&1 | tee -a ci.log
          flutter build apk $COMMON 2>&1 | tee -a ci.log
          mkdir -p dist
          OUT=build/app/outputs/flutter-apk
          cp $OUT/app-release.apk             dist/Nexus-universal.apk
          cp $OUT/app-arm64-v8a-release.apk   dist/Nexus-arm64.apk
          cp $OUT/app-armeabi-v7a-release.apk dist/Nexus-armv7.apk
          cd dist && sha256sum *.apk > SHA256SUMS-android.txt
          echo "$CORE" > xray-android.txt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Nexus-Android
          path: dist/*

      - name: Причина ошибки
        if: failure()
        run: |
          {
            echo "## ❌ Android: причина ошибки"
            echo '```'
            if [ -f ci.log ]; then
              grep -n -E "What went wrong|FAILURE|error:|Error:|Exception|Could not|> " ci.log | tail -40 || true
              echo "----- последние строки -----"
              tail -40 ci.log
            else
              echo "Лог сборки не создан — ошибка на шаге до сборки, откройте задачу Android (APK)."
            fi
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  windows:
    name: Windows (x64)
    needs: [check, code]
    if: needs.check.outputs.run == 'true'
    runs-on: windows-latest
    env:
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Сгенерировать платформу Windows
        shell: bash
        run: |
          flutter create --platforms=android,windows --org $ORG --project-name nexus .
          rm -f test/widget_test.dart
          python tool/patch_platforms.py

      - name: Зависимости и иконки
        shell: bash
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          # Своя многоразмерная иконка: чёткая на панели задач.
          cp assets/icon/app_icon.ico windows/runner/resources/app_icon.ico

      - name: Ключ проверки обновлений
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            echo "$UPDATE_SIGNING_KEY" | base64 -d > upd.pem
            PUB=$(openssl pkey -in upd.pem -pubout -outform DER | tail -c 32 | base64 -w0)
            rm upd.pem
            echo "UPDATE_PUBKEY=$PUB" >> $GITHUB_ENV
            echo "Обновления будут проверяться подписью"
          else
            echo "::warning::Секрет UPDATE_SIGNING_KEY не задан — подпись обновлений отключена"
          fi

      - name: Ядро Xray (скачать и проверить)
        shell: pwsh
        run: |
          $base = "https://github.com/XTLS/Xray-core/releases/latest/download"
          Invoke-WebRequest "$base/Xray-windows-64.zip" -MaximumRetryCount 4 -RetryIntervalSec 5 -OutFile xray.zip
          Invoke-WebRequest "$base/Xray-windows-64.zip.dgst" -MaximumRetryCount 4 -RetryIntervalSec 5 -OutFile xray.dgst
          $want = ((Get-Content xray.dgst -Raw) | Select-String -Pattern 'SHA2-256=\s*([0-9a-fA-F]{64})').Matches[0].Groups[1].Value.ToLower()
          $got = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "Контрольная сумма Xray не совпала: $got != $want" }
          Expand-Archive xray.zip -DestinationPath xray
          # Отпечатки ядра и драйвера TUN вшиваются в Nexus: с правами
          # администратора он запустит только эти файлы.
          $core = (Get-FileHash xray\xray.exe -Algorithm SHA256).Hash.ToLower()
          $wt = (Get-FileHash xray\wintun.dll -Algorithm SHA256).Hash.ToLower()
          "CORE_SHA256=$core" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINTUN_SHA256=$wt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Список заблокированных сайтов (см. tool/make_blocked_dat.py).
          $blocked = "false"
          try {
            Invoke-WebRequest "$env:RF_URL/geosite.dat" -MaximumRetryCount 4 -RetryIntervalSec 5 -OutFile rf-geosite.dat
            Invoke-WebRequest "$env:RF_URL/geosite.dat.sha256sum" -MaximumRetryCount 4 -RetryIntervalSec 5 -OutFile rf-geosite.dat.sha256sum
            $w = ((Get-Content rf-geosite.dat.sha256sum -Raw).Trim() -split '\s+')[0].ToLower()
            $g = (Get-FileHash rf-geosite.dat -Algorithm SHA256).Hash.ToLower()
            if ($w -ne $g) { throw "SHA-256 не совпал" }
            python tool/make_blocked_dat.py rf-geosite.dat nexus-blocked.dat
            if ($LASTEXITCODE -ne 0) { throw "make_blocked_dat.py" }
            $blocked = "true"
          } catch {
            Write-Host "::warning::Список заблокированных сайтов не собран: $_"
          }
          Remove-Item rf-geosite.dat* -ErrorAction SilentlyContinue
          "BLOCKED_DAT=$blocked" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Сборка
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          flutter build windows --release --obfuscate --split-debug-info=build/symbols \
            --build-name=$VER --build-number=$BUILD \
            --dart-define=UPDATE_REPO=$UPDATE_REPO --dart-define=APP_VERSION=$VER --dart-define=APP_BUILD=$BUILD --dart-define=UPDATE_PUBKEY=$UPDATE_PUBKEY --dart-define=RENEW_URL=$RENEW_URL --dart-define=APP_CHANNEL=$APP_CHANNEL --dart-define=CORE_SHA256=$CORE_SHA256 --dart-define=WINTUN_SHA256=$WINTUN_SHA256 --dart-define=BLOCKED_DAT=$BLOCKED_DAT

      - name: Ядро Xray и гео-базы
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          # xray\ скачан и проверен до сборки (шаг «Ядро Xray»).
          Copy-Item xray\xray.exe "$rel\nexus-core.exe"
          # Драйвер виртуальной сетевой карты для режима TUN (идёт в архиве Xray).
          Copy-Item xray\wintun.dll "$rel\wintun.dll"
          Copy-Item xray\LICENSE-Wintun "$rel\LICENSE-Wintun.txt"
          if (Test-Path nexus-blocked.dat) { Copy-Item nexus-blocked.dat "$rel\nexus-blocked.dat" }
          foreach ($g in "geoip.dat","geosite.dat") {
            Invoke-WebRequest "$env:GEO_URL/$g" -MaximumRetryCount 4 -RetryIntervalSec 5 -OutFile "$rel\$g"
            Invoke-WebRequest "$env:GEO_URL/$g.sha256sum" -MaximumRetryCount 4 -RetryIntervalSec 5 -OutFile "$g.sha256sum"
            $want = ((Get-Content "$g.sha256sum" -Raw).Trim() -split '\s+')[0].ToLower()
            $got = (Get-FileHash "$rel\$g" -Algorithm SHA256).Hash.ToLower()
            if ($want -ne $got) { throw "Контрольная сумма $g не совпала" }
          }
          & "$rel\nexus-core.exe" version

      - name: Архив
        shell: pwsh
        run: |
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([\d.]+)').Matches[0].Groups[1].Value)
          echo "VER=$ver" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\Nexus-Windows-x64.zip"

      - name: Установщик
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VER" tool\nexus.iss

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Nexus-Windows
          path: dist/*

  linux:
    name: Linux (x64)
    needs: [check, code]
    if: needs.check.outputs.run == 'true'
    # Новая платформа: её сбой не задерживает релиз Android и Windows.
    continue-on-error: true
    # Ubuntu 22.04 — сборка запустится и на дистрибутивах постарше.
    runs-on: ubuntu-22.04
    env:
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Системные пакеты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libstdc++-12-dev

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Сгенерировать платформу Linux
        run: |
          flutter create --platforms=linux --org $ORG --project-name nexus .
          rm -f test/widget_test.dart
          python3 tool/patch_platforms.py
          flutter pub get

      - name: Ключ проверки обновлений
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            echo "$UPDATE_SIGNING_KEY" | base64 -d > upd.pem
            PUB=$(openssl pkey -in upd.pem -pubout -outform DER | tail -c 32 | base64 -w0)
            rm upd.pem
            echo "UPDATE_PUBKEY=$PUB" >> $GITHUB_ENV
          else
            echo "::warning::Секрет UPDATE_SIGNING_KEY не задан — подпись обновлений отключена"
          fi

      - name: Ядро Xray (скачать и проверить)
        run: |
          set -e
          base=https://github.com/XTLS/Xray-core/releases/latest/download
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o xray.zip "$base/Xray-linux-64.zip"
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o xray.dgst "$base/Xray-linux-64.zip.dgst"
          want=$(grep -oE 'SHA2-256=\s*[0-9a-fA-F]{64}' xray.dgst | grep -oE '[0-9a-fA-F]{64}' | tr A-F a-f)
          got=$(sha256sum xray.zip | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "Контрольная сумма Xray не совпала"; exit 1; }
          mkdir xray && unzip -q xray.zip -d xray
          # Отпечаток ядра вшивается в Nexus: для режима TUN ставится только оно.
          echo "CORE_SHA256=$(sha256sum xray/xray | cut -d' ' -f1)" >> $GITHUB_ENV
          BLOCKED=false
          if curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o rf.dat "$RF_URL/geosite.dat" && curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o rf.sum "$RF_URL/geosite.dat.sha256sum" \
             && [ "$(cut -d' ' -f1 rf.sum)" = "$(sha256sum rf.dat | cut -d' ' -f1)" ] \
             && python3 tool/make_blocked_dat.py rf.dat nexus-blocked.dat; then
            BLOCKED=true
          else
            echo "::warning::Список заблокированных сайтов не собран"
          fi
          rm -f rf.dat rf.sum
          echo "BLOCKED_DAT=$BLOCKED" >> $GITHUB_ENV

      - name: Сборка
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VER=$VER" >> $GITHUB_ENV
          flutter build linux --release --obfuscate --split-debug-info=build/symbols \
            --build-name=$VER --build-number=$BUILD \
            --dart-define=UPDATE_REPO=$UPDATE_REPO --dart-define=APP_VERSION=$VER --dart-define=APP_BUILD=$BUILD --dart-define=UPDATE_PUBKEY=$UPDATE_PUBKEY --dart-define=RENEW_URL=$RENEW_URL --dart-define=APP_CHANNEL=$APP_CHANNEL --dart-define=CORE_SHA256=$CORE_SHA256 --dart-define=BLOCKED_DAT=$BLOCKED_DAT

      - name: Ядро, гео-базы и архив
        run: |
          set -e
          B=build/linux/x64/release/bundle
          install -m 755 xray/xray "$B/nexus-core"
          [ -f nexus-blocked.dat ] && cp nexus-blocked.dat "$B/"
          for g in geoip.dat geosite.dat; do
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "$B/$g" "$GEO_URL/$g"
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "$g.sum" "$GEO_URL/$g.sha256sum"
            [ "$(cut -d' ' -f1 $g.sum)" = "$(sha256sum $B/$g | cut -d' ' -f1)" ] || { echo "Контрольная сумма $g не совпала"; exit 1; }
          done
          "$B/nexus-core" version
          install -m 755 tool/linux/install.sh "$B/install.sh"
          mkdir -p dist stage
          cp -a "$B" stage/nexus
          tar -C stage -czf dist/Nexus-Linux-x64.tar.gz nexus

      - name: Пакет .deb (Ubuntu, Debian, Mint)
        run: |
          set -e
          B=build/linux/x64/release/bundle
          D=deb/nexus-vpn
          mkdir -p $D/DEBIAN $D/opt/nexus $D/usr/bin $D/usr/share/applications $D/usr/share/icons/hicolor/256x256/apps
          cp -a "$B/." $D/opt/nexus/
          rm -f $D/opt/nexus/install.sh
          ln -s /opt/nexus/nexus $D/usr/bin/nexus
          convert assets/icon/app_icon.png -resize 256x256 $D/usr/share/icons/hicolor/256x256/apps/nexus.png
          cat > $D/usr/share/applications/nexus.desktop <<'DT'
          [Desktop Entry]
          Type=Application
          Name=Nexus
          Comment=VPN
          Exec=/opt/nexus/nexus %u
          Icon=nexus
          Terminal=false
          Categories=Network;
          MimeType=x-scheme-handler/nexus;
          StartupWMClass=nexus
          DT
          SIZE=$(du -sk $D | cut -f1)
          cat > $D/DEBIAN/control <<CT
          Package: nexus-vpn
          Version: $VER
          Architecture: amd64
          Maintainer: NEXUS_VPN <noreply@nexus.invalid>
          Installed-Size: $SIZE
          Depends: libgtk-3-0 | libgtk-3-0t64, libayatana-appindicator3-1, libcap2-bin
          Section: net
          Priority: optional
          Homepage: https://github.com/$UPDATE_REPO
          Description: Nexus — VPN-клиент NEXUS_VPN (Xray)
           Подписки, режим «Авто», умный режим, системный прокси и режим TUN.
          CT
          # Режим TUN без пароля: ядро в /opt/nexus принадлежит root, и
          # установщик даёт ему только право управлять сетью.
          cat > $D/DEBIAN/postinst <<'PI'
          #!/bin/sh
          set -e
          if command -v setcap >/dev/null 2>&1; then
            setcap cap_net_admin,cap_net_raw+ep /opt/nexus/nexus-core || true
          fi
          command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database -q || true
          command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -q /usr/share/icons/hicolor || true
          exit 0
          PI
          chmod 755 $D/DEBIAN/postinst
          dpkg-deb --root-owner-group --build $D dist/Nexus-Linux-x64.deb
          dpkg-deb --info dist/Nexus-Linux-x64.deb | head -12

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Nexus-Linux
          path: dist/*

  macos:
    name: macOS (Apple Silicon + Intel)
    needs: [check, code]
    if: needs.check.outputs.run == 'true'
    continue-on-error: true
    runs-on: macos-15
    env:
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Сгенерировать платформу macOS
        run: |
          flutter create --platforms=macos --org $ORG --project-name nexus .
          rm -f test/widget_test.dart
          python3 tool/patch_platforms.py
          flutter pub get
          cat > icons-macos.yaml <<'YML'
          flutter_launcher_icons:
            image_path: "assets/icon/app_icon.png"
            macos:
              generate: true
              image_path: "assets/icon/app_icon.png"
          YML
          dart run flutter_launcher_icons -f icons-macos.yaml || echo "::warning::Иконка macOS не сгенерирована"

      - name: Ключ проверки обновлений
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            python3 -c "import base64,os,sys; sys.stdout.buffer.write(base64.b64decode(os.environ['UPDATE_SIGNING_KEY']))" > upd.pem
            PUB=$(openssl pkey -in upd.pem -pubout -outform DER | tail -c 32 | base64 | tr -d '\n')
            rm upd.pem
            echo "UPDATE_PUBKEY=$PUB" >> $GITHUB_ENV
          fi

      - name: Ядро Xray (универсальное, с проверкой)
        run: |
          set -e
          base=https://github.com/XTLS/Xray-core/releases/latest/download
          for a in macos-64 macos-arm64-v8a; do
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "x-$a.zip" "$base/Xray-$a.zip"
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "x-$a.dgst" "$base/Xray-$a.zip.dgst"
            want=$(grep -oE 'SHA2-256=\s*[0-9a-fA-F]{64}' "x-$a.dgst" | grep -oE '[0-9a-fA-F]{64}' | tr A-F a-f)
            got=$(shasum -a 256 "x-$a.zip" | cut -d' ' -f1)
            [ "$want" = "$got" ] || { echo "Контрольная сумма Xray $a не совпала"; exit 1; }
            mkdir "x-$a" && unzip -q "x-$a.zip" -d "x-$a"
          done
          # Одно ядро для Apple Silicon и Intel.
          lipo -create -output nexus-core x-macos-64/xray x-macos-arm64-v8a/xray
          chmod 755 nexus-core
          cp x-macos-arm64-v8a/geoip.dat x-macos-arm64-v8a/geosite.dat . 2>/dev/null || true
          BLOCKED=false
          if curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o rf.dat "$RF_URL/geosite.dat" && curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o rf.sum "$RF_URL/geosite.dat.sha256sum" \
             && [ "$(cut -d' ' -f1 rf.sum)" = "$(shasum -a 256 rf.dat | cut -d' ' -f1)" ] \
             && python3 tool/make_blocked_dat.py rf.dat nexus-blocked.dat; then
            BLOCKED=true
          fi
          rm -f rf.dat rf.sum
          echo "BLOCKED_DAT=$BLOCKED" >> $GITHUB_ENV

      - name: Подпись ядра
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # Ядро подписывается до сборки: его отпечаток (уже подписанного)
          # вшивается в Nexus, и в режиме TUN запустится только оно.
          if [ -n "$MACOS_CERT_P12" ]; then
            KC=$RUNNER_TEMP/nexus.keychain-db
            KP=$(openssl rand -hex 16)
            security create-keychain -p "$KP" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KP" "$KC"
            python3 -c "import base64,os,sys; sys.stdout.buffer.write(base64.b64decode(os.environ['MACOS_CERT_P12']))" > cert.p12
            security import cert.p12 -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            rm cert.p12
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            IDENT=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | awk '{print $2}')
            [ -n "$IDENT" ] || { echo "::error::В сертификате нет «Developer ID Application»"; exit 1; }
            echo "IDENT=$IDENT" >> $GITHUB_ENV
            codesign --force --options runtime --timestamp --sign "$IDENT" nexus-core
          else
            echo "::warning::Секрет MACOS_CERT_P12 не задан — сборка macOS без подписи Apple"
            codesign --force --sign - nexus-core
          fi
          echo "CORE_SHA256=$(shasum -a 256 nexus-core | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Сборка
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VER=$VER" >> $GITHUB_ENV
          flutter build macos --release --obfuscate --split-debug-info=build/symbols \
            --build-name=$VER --build-number=$BUILD \
            --dart-define=UPDATE_REPO=$UPDATE_REPO --dart-define=APP_VERSION=$VER --dart-define=APP_BUILD=$BUILD --dart-define=UPDATE_PUBKEY=$UPDATE_PUBKEY --dart-define=RENEW_URL=$RENEW_URL --dart-define=APP_CHANNEL=$APP_CHANNEL --dart-define=CORE_SHA256=$CORE_SHA256 --dart-define=BLOCKED_DAT=$BLOCKED_DAT

      - name: Ядро, гео-базы, подпись приложения
        run: |
          set -e
          APP=build/macos/Build/Products/Release/Nexus.app
          cp nexus-core "$APP/Contents/MacOS/nexus-core"
          R="$APP/Contents/Resources"
          [ -f nexus-blocked.dat ] && cp nexus-blocked.dat "$R/"
          for g in geoip.dat geosite.dat; do
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "$R/$g" "$GEO_URL/$g"
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "$g.sum" "$GEO_URL/$g.sha256sum"
            [ "$(cut -d' ' -f1 $g.sum)" = "$(shasum -a 256 $R/$g | cut -d' ' -f1)" ] || { echo "Контрольная сумма $g не совпала"; exit 1; }
          done
          "$APP/Contents/MacOS/nexus-core" version
          ENT=macos/Runner/Release.entitlements
          # Изнутри наружу: библиотеки, затем само приложение. Ядро уже
          # подписано (его отпечаток вшит в Nexus) — его не трогаем, поэтому
          # без --deep.
          if [ -n "$IDENT" ]; then OPTS="--options runtime --timestamp --sign $IDENT"; else OPTS="--sign -"; fi
          find "$APP/Contents/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 |
            xargs -0 -I{} codesign --force $OPTS {}
          codesign --force $OPTS --entitlements "$ENT" "$APP"
          [ "$(shasum -a 256 "$APP/Contents/MacOS/nexus-core" | cut -d' ' -f1)" = "$CORE_SHA256" ] || { echo "Ядро изменилось при подписи"; exit 1; }
          codesign --verify --deep --strict "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" dist/Nexus-macOS.zip

      - name: Нотаризация Apple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$IDENT" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::Нотаризация пропущена (нет подписи или ключа App Store Connect)"
            exit 0
          fi
          python3 -c "import base64,os,sys; sys.stdout.buffer.write(base64.b64decode(os.environ['APPLE_API_KEY_P8']))" > key.p8
          xcrun notarytool submit dist/Nexus-macOS.zip --key key.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          rm key.p8
          APP=build/macos/Build/Products/Release/Nexus.app
          xcrun stapler staple "$APP"
          rm dist/Nexus-macOS.zip
          ditto -c -k --keepParent "$APP" dist/Nexus-macOS.zip

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Nexus-macOS
          path: dist/*

  ios:
    name: iOS (iPhone и iPad)
    needs: [check, code]
    if: needs.check.outputs.run == 'true'
    continue-on-error: true
    runs-on: macos-15
    env:
      BUILD: ${{ needs.check.outputs.build }}
      # libXray на Xray 26.10.31 (то же ядро, что у Nexus на других системах).
      LIBXRAY_REF: 645bf9a36b7d26420e1e8d471620cbe133d9b2ae
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Кэш ядра для iOS
        id: lx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: LibXray.xcframework
          key: libxray-ios-${{ env.LIBXRAY_REF }}

      - name: Исходники libXray
        if: steps.lx.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/XTLS/libXray lx
          git -C lx checkout -q "$LIBXRAY_REF"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.lx.outputs.cache-hit != 'true'
        with:
          go-version-file: lx/go.mod
          cache: false

      - name: Сборка ядра для iOS (gomobile)
        if: steps.lx.outputs.cache-hit != 'true'
        run: |
          set -e
          cd lx
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          gomobile bind -target ios -iosversion 15.0 -trimpath -ldflags="-s -w" -o ../LibXray.xcframework .
          ls ../LibXray.xcframework

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Сгенерировать платформу iOS
        run: |
          flutter create --platforms=ios --org $ORG --project-name nexus .
          rm -f test/widget_test.dart
          python3 tool/patch_platforms.py
          flutter pub get
          cat > icons-ios.yaml <<'YML'
          flutter_launcher_icons:
            image_path: "assets/icon/app_icon.png"
            ios: true
            remove_alpha_ios: true
          YML
          dart run flutter_launcher_icons -f icons-ios.yaml || echo "::warning::Иконка iOS не сгенерирована"

      - name: Гео-базы (только нужные Nexus категории)
        run: |
          set -e
          for g in geoip.dat geosite.dat; do
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "full-$g" "$GEO_URL/$g"
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "$g.sum" "$GEO_URL/$g.sha256sum"
            [ "$(cut -d' ' -f1 $g.sum)" = "$(shasum -a 256 full-$g | cut -d' ' -f1)" ] || { echo "Контрольная сумма $g не совпала"; exit 1; }
          done
          # Память VPN-расширения на iPhone ограничена (~50 МБ) — полные базы
          # (27 МБ) туда не помещаются, берём только используемые категории.
          python3 tool/make_blocked_dat.py full-geosite.dat ios/Runner/geosite.dat category-ads-all
          python3 tool/make_blocked_dat.py full-geoip.dat ios/Runner/geoip.dat ru,telegram,private
          BLOCKED=false
          if curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o rf.dat "$RF_URL/geosite.dat" && curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o rf.sum "$RF_URL/geosite.dat.sha256sum" \
             && [ "$(cut -d' ' -f1 rf.sum)" = "$(shasum -a 256 rf.dat | cut -d' ' -f1)" ] \
             && python3 tool/make_blocked_dat.py rf.dat ios/Runner/nexus-blocked.dat; then
            BLOCKED=true
          fi
          rm -f rf.dat rf.sum full-*.dat
          echo "BLOCKED_DAT=$BLOCKED" >> $GITHUB_ENV

      - name: Расширение NexusTunnel в проекте Xcode
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VER=$VER" >> $GITHUB_ENV
          cp -R LibXray.xcframework ios/
          ruby tool/ios/add_tunnel.rb "$VER" "$BUILD"
          # Podfile из шаблона Flutter с явной платформой (LibXray — iOS 15+).
          sed "s/^# platform :ios.*/platform :ios, '15.0'/" \
            "$FLUTTER_ROOT/packages/flutter_tools/templates/cocoapods/Podfile-ios" > ios/Podfile
          grep -n "^platform" ios/Podfile
          flutter pub get
          (cd ios && pod install)

      - name: Сборка
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -e
          DEFS="--dart-define=APP_VERSION=$VER --dart-define=APP_BUILD=$BUILD --dart-define=RENEW_URL=$RENEW_URL --dart-define=APP_CHANNEL=$APP_CHANNEL --dart-define=BLOCKED_DAT=$BLOCKED_DAT"
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::Нет APPLE_TEAM_ID или ключа App Store Connect — iOS собирается без подписи (проверка, что всё компилируется)"
            flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols \
              --build-name=$VER --build-number=$BUILD $DEFS
            exit 0
          fi
          KEY=$RUNNER_TEMP/AuthKey.p8
          python3 -c "import base64,os,sys; sys.stdout.buffer.write(base64.b64decode(os.environ['APPLE_API_KEY_P8']))" > "$KEY"
          flutter build ios --release --config-only --obfuscate --split-debug-info=build/symbols \
            --build-name=$VER --build-number=$BUILD $DEFS
          (cd ios && pod install)
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $APPLE_API_KEY_ID -authenticationKeyIssuerID $APPLE_API_ISSUER"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Nexus.xcarchive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Automatic $AUTH archive | tail -30
          cat > ExportOptions.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PL
          # Отправка в App Store Connect → TestFlight.
          xcodebuild -exportArchive -archivePath build/Nexus.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa $AUTH | tail -30
          rm -f "$KEY"
          echo "::notice::Nexus $VER ($BUILD) отправлен в TestFlight"

  release:
    name: Релиз
    # Linux и macOS — необязательные (continue-on-error): их сбой не задерживает релиз.
    needs: [check, android, windows, linux, macos]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            pubspec.yaml
            lib/changelog.dart
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: out
          merge-multiple: true

      - name: Описание релиза
        id: meta
        run: |
          # В релиз идёт только ядро, собранное из исходников в этой сборке.
          if [ "$(cat out/xray-android.txt 2>/dev/null)" != "${{ needs.check.outputs.xray }}" ] && \
             [ "$(cat out/xray-android.txt 2>/dev/null)" != "$(echo ${{ needs.check.outputs.xray }} | sed 's/^v//')" ]; then
            echo "::error::Свежее ядро Xray для Android не собралось — релиз не публикуется (файлы есть в артефактах сборки)"
            exit 1
          fi
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          BUILD=${{ needs.check.outputs.build }}
          CORE=$(cat out/xray-android.txt 2>/dev/null || echo "")
          XRAY=${{ needs.check.outputs.xray }}
          cd out
          rm -f xray-android.txt
          rm -f SHA256SUMS-android.txt
          sha256sum * > SHA256SUMS.txt
          cd ..
          NAME="Nexus $VER"
          if [ "$CORE" = "${XRAY#v}" ]; then NAME="$NAME · Xray ${XRAY#v}"; else CORE=""; fi
          if [ "${{ github.ref_name }}" = "beta" ]; then
            NAME="$NAME · бета $BUILD"
          elif [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then
            NAME="$NAME · PR #${{ github.event.pull_request.number }}"
          fi
          echo "name=$NAME" >> $GITHUB_OUTPUT
          # Тег — просто версия. Для пробных сборок из PR — с номером PR.
          if [ "${{ github.ref_name }}" = "beta" ]; then
            # Каждая бета — отдельный релиз: не заменяет обычный той же версии.
            echo "tag=v$VER-beta$BUILD" >> $GITHUB_OUTPUT
          elif [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then
            echo "tag=v$VER-pr${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$VER" >> $GITHUB_OUTPUT
          fi
          # «Что нового» — из lib/changelog.dart для этой версии.
          NOTES=$(python3 - "$VER" <<'PY'
          import re, sys
          src = open('lib/changelog.dart', encoding='utf-8').read()
          m = re.search(r"\('" + re.escape(sys.argv[1]) + r"',\s*\[(.*?)\]\)", src, re.S)
          for item in re.findall(r"'((?:[^'\\]|\\.)*)'", m.group(1) if m else ''):
              print('- ' + item.replace("\\'", "'"))
          PY
          )
          {
            if [ -n "$NOTES" ]; then
              echo "### Что нового"
              echo "$NOTES"
              echo
            fi
            echo "**Android:** Nexus-arm64.apk — большинство телефонов, Nexus-armv7.apk — старые, Nexus-universal.apk — любой."
            echo "**Windows:** Nexus-Setup-$VER.exe — установщик, Nexus-Windows-x64.zip — портативная версия."
            if [ -f out/Nexus-Linux-x64.tar.gz ]; then
              echo "**Linux:** Nexus-Linux-x64.deb — пакет для Ubuntu/Debian/Mint (двойной клик или \`sudo apt install ./Nexus-Linux-x64.deb\`), Nexus-Linux-x64.tar.gz — для других дистрибутивов (распакуйте и запустите install.sh)."
            fi
            if [ -f out/Nexus-macOS.zip ]; then
              echo "**macOS:** Nexus-macOS.zip — распакуйте и перенесите Nexus в «Программы»."
            fi
            echo
            echo "<!--"
            echo "nexus-build: $BUILD"
            echo "xray: ${CORE}"
            echo "-->"
          } > notes.md

      # Повторная сборка той же версии заменяет прежний релиз, а не плодит новые.
      - name: Убрать прежний релиз этой версии
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" -R "$UPDATE_REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "$UPDATE_REPO" --cleanup-tag -y
            echo "Прежний релиз $TAG заменён"
          fi

      - name: Подпись релиза
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            echo "$UPDATE_SIGNING_KEY" | base64 -d > upd.pem
            openssl pkeyutl -sign -inkey upd.pem -rawin -in out/SHA256SUMS.txt -out out/SHA256SUMS.txt.sig
            rm upd.pem
            echo "Релиз подписан"
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: ${{ env.UPDATE_REPO }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ vars.RELEASES_REPO == '' && github.sha || '' }}
          name: ${{ steps.meta.outputs.name }}
          body_path: notes.md
          files: out/*
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.check.outputs.prerelease == 'true' && 'false' || 'true' }}
