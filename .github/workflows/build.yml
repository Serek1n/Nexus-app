name: Сборка Nexus

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ORG: app.nexusvpn
  GEO_URL: https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Плагин ядра Xray пока несовместим с AGP 9 (Flutter 3.44+), поэтому версия зафиксирована.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Сгенерировать платформу Android
        run: |
          flutter create --platforms=android,windows --org $ORG --project-name nexus .
          rm -rf test
          python3 tool/patch_platforms.py

      - name: Гео-базы для умной маршрутизации
        run: |
          mkdir -p android/app/src/main/assets
          curl -fsSL -o android/app/src/main/assets/geoip.dat   $GEO_URL/geoip.dat
          curl -fsSL -o android/app/src/main/assets/geosite.dat $GEO_URL/geosite.dat

      - name: Ключ подписи (если задан в секретах)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/nexus-release.jks
            cat > android/key.properties <<EOF
          storeFile=nexus-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Подпись: релизный ключ"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK подписан отладочным ключом, обновление поверх старой версии работать не будет"
          fi

      - name: Зависимости и иконки
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Сборка APK
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          mkdir -p dist
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk             dist/Nexus-$VER-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   dist/Nexus-$VER-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Nexus-$VER-armv7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-Android
          path: dist/*.apk

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Сгенерировать платформу Windows
        shell: bash
        run: |
          flutter create --platforms=android,windows --org $ORG --project-name nexus .
          rm -rf test
          python tool/patch_platforms.py

      - name: Зависимости и иконки
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Сборка
        run: flutter build windows --release

      - name: Ядро Xray и гео-базы
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray
          Copy-Item xray\xray.exe "$rel\nexus-core.exe"
          Invoke-WebRequest "$env:GEO_URL/geoip.dat"   -OutFile "$rel\geoip.dat"
          Invoke-WebRequest "$env:GEO_URL/geosite.dat" -OutFile "$rel\geosite.dat"
          & "$rel\nexus-core.exe" version

      - name: Архив
        shell: pwsh
        run: |
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([\d.]+)').Matches[0].Groups[1].Value)
          echo "VER=$ver" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\Nexus-$ver-Windows-x64.zip"

      - name: Установщик
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VER" tool\nexus.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-Windows
          path: dist/*

  release:
    name: Релиз на GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
